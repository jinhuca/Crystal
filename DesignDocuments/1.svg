<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="Consolas, monospace">
  <!-- palette: bg #0A0A0A, tile #121212, border #2A2A2A, grid #303030,
       accent-pink #E82A7A, load-green #3BD15A, text #D0D0D0, dim #6A6A6A -->
  <rect width="1280" height="960" fill="#0A0A0A"/>

  <!-- ============ ROW 1: CPU (full width) ============ -->
  <g transform="translate(16,16)">
    <rect width="1248" height="300" fill="#121212" stroke="#2A2A2A"/>
    <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">CPU — Ryzen 9 7950X</text>
    <text x="1236" y="24" text-anchor="end" fill="#6A6A6A" font-size="11">16C / 32T</text>

    <!-- left: summary metrics -->
    <g transform="translate(12,44)" font-size="12">
      <text fill="#6A6A6A">Load</text>   <text x="90" fill="#3BD15A">42.3 %</text>
      <text y="22" fill="#6A6A6A">Clock</text> <text x="90" y="22" fill="#D0D0D0">5.05 GHz</text>
      <text y="44" fill="#6A6A6A">Temp</text> <text x="90" y="44" fill="#D0D0D0">61 °C</text>
      <text y="66" fill="#6A6A6A">Power</text><text x="90" y="66" fill="#D0D0D0">128 W</text>
    </g>

    <!-- center: CPU Load PerformanceGraph -->
    <g transform="translate(200,44)">
      <text fill="#6A6A6A" font-size="11">CPU Load: PerformanceGraph</text>
      <rect y="8" width="440" height="120" fill="#0E0E0E" stroke="#242424"/>
      <line x1="0" y1="38"  x2="440" y2="38"  stroke="#303030" stroke-width="0.5"/>
      <line x1="0" y1="68"  x2="440" y2="68"  stroke="#303030" stroke-width="0.5"/>
      <line x1="0" y1="98"  x2="440" y2="98"  stroke="#303030" stroke-width="0.5"/>
      <polyline fill="none" stroke="#E82A7A" stroke-width="1.5"
        points="0,110 40,92 80,100 120,60 160,74 200,40 240,66 280,52 320,84 360,48 400,70 440,58"/>
    </g>

    <!-- right: per-core load list (8 rows/column, wrap into columns) -->
    <g transform="translate(672,44)" font-size="11">
      <text fill="#6A6A6A">Per-core load</text>
      <!-- one core row template; duplicate & edit label/value/bar-width -->
      <g transform="translate(0,14)">
        <!-- column 1 -->
        <g><text fill="#D0D0D0">C00</text><text x="42" fill="#3BD15A">5.12%</text>
           <rect x="86" y="-8" width="80" height="8" fill="#0E0E0E" stroke="#242424"/>
           <rect x="86" y="-8" width="41" height="8" fill="#E82A7A"/></g>
        <g transform="translate(0,20)"><text fill="#D0D0D0">C01</text><text x="42" fill="#3BD15A">1.21%</text>
           <rect x="86" y="-8" width="80" height="8" fill="#0E0E0E" stroke="#242424"/>
           <rect x="86" y="-8" width="10" height="8" fill="#E82A7A"/></g>
        <!-- ...repeat to C07, then start column 2 at translate(200,0) -->
      </g>
    </g>
  </g>

  <!-- ============ ROW 2: GPU | Memory | Storage ============ -->
  <g transform="translate(16,332)">
    <!-- GPU -->
    <rect width="408" height="280" fill="#121212" stroke="#2A2A2A"/>
    <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">GPU</text>
    <rect x="12" y="120" width="384" height="140" fill="#0E0E0E" stroke="#242424"/>
    <polyline fill="none" stroke="#3BD15A" stroke-width="1.5"
      points="12,230 60,200 108,215 156,170 204,190 252,150 300,178 348,140 396,205"/>

    <!-- Memory -->
    <g transform="translate(420,0)">
      <rect width="408" height="280" fill="#121212" stroke="#2A2A2A"/>
      <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">Memory</text>
    </g>

    <!-- Storage -->
    <g transform="translate(840,0)">
      <rect width="408" height="280" fill="#121212" stroke="#2A2A2A"/>
      <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">Storage</text>
    </g>
  </g>

  <!-- ============ ROW 3: Network | BIOS ============ -->
  <g transform="translate(16,628)">
    <rect width="616" height="300" fill="#121212" stroke="#2A2A2A"/>
    <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">Network</text>
    <g transform="translate(632,0)">
      <rect width="616" height="300" fill="#121212" stroke="#2A2A2A"/>
      <text x="12" y="24" fill="#D0D0D0" font-size="13" font-weight="bold">BIOS</text>
    </g>
  </g>
</svg>